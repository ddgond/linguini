name: Build

# Every push and pull request: build the extension and run the tests.
# Tagged releases are packaged by release.yml.
on:
  push:
    branches: ["**"]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons pkg-config ffmpeg libavcodec-dev libavutil-dev libopus-dev \
            libssl-dev libcurl4-openssl-dev libexpat1-dev
      - name: Check the models are up to date with art/
        run: python3 art/check.py
      - name: Build extension
        run: scons -j4
      - name: Run tests
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          godot="./Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          # Register the extension up front. On a fresh checkout Godot otherwise
          # finds it mid-scan, and that first import crashes on exit.
          mkdir -p godot/.godot && echo "res://linguini.gdextension" > godot/.godot/extension_list.cfg
          "$godot" --headless --path godot --import
          "$godot" --headless --path godot -s res://tests/run_tests.gd
      - uses: actions/upload-artifact@v4
        with:
          name: linguini-linux
          path: godot/bin/

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install scons pkg-config ffmpeg opus openssl@3 curl expat
      - name: Build extension
        run: |
          PKG_CONFIG_PATH="$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig:$PKG_CONFIG_PATH"
          export PKG_CONFIG_PATH
          scons -j4 arch=arm64
      - name: Run tests
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip
          godot="./Godot.app/Contents/MacOS/Godot"
          # Register the extension up front. On a fresh checkout Godot otherwise
          # finds it mid-scan, and that first import crashes on exit.
          mkdir -p godot/.godot && echo "res://linguini.gdextension" > godot/.godot/extension_list.cfg
          "$godot" --headless --path godot --import
          "$godot" --headless --path godot -s res://tests/run_tests.gd
      - uses: actions/upload-artifact@v4
        with:
          name: linguini-macos
          path: godot/bin/

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SCons and FFmpeg
        # FFmpeg's command line makes the decoder test's video (the extension
        # links its own static FFmpeg libraries, from vcpkg).
        run: |
          pip install scons
          choco install ffmpeg -y --no-progress
      # vcpkg's binary cache: FFmpeg and friends take a while to build and
      # change only with the manifest or the script that pins vcpkg.
      - uses: actions/cache@v4
        with:
          path: dist/windows/vcpkg-cache
          key: windows-deps-${{ hashFiles('packaging/windows/vcpkg.json', 'packaging/windows/build-deps.ps1') }}
      - name: Build dependencies
        run: packaging/windows/build-deps.ps1
      - name: Build extension
        run: |
          $env:LINGUINI_DEPS_PREFIX = "$pwd/dist/windows/deps/x64-windows-static-release"
          scons -j4
      - name: Run tests
        run: |
          curl.exe -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${env:GODOT_VERSION}-stable/Godot_v${env:GODOT_VERSION}-stable_win64.exe.zip"
          Expand-Archive godot.zip -DestinationPath .
          $godot = "./Godot_v${env:GODOT_VERSION}-stable_win64_console.exe"
          # Register the extension up front. On a fresh checkout Godot otherwise
          # finds it mid-scan, and that first import crashes on exit.
          New-Item -ItemType Directory -Force godot/.godot | Out-Null
          [IO.File]::WriteAllText("$pwd/godot/.godot/extension_list.cfg", "res://linguini.gdextension`n")
          & $godot --headless --path godot --import
          & $godot --headless --path godot -s res://tests/run_tests.gd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: linguini-windows
          path: godot/bin/*.dll
