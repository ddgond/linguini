name: Release

# Pushing a version tag (v0.1.0, v1.2.3-beta.1, ...) packages the Linux and
# macOS builds, publishes them as a GitHub Release, and then has pages.yml
# deploy the landing page with download links pointing at that release.
on:
  push:
    tags: ["v*"]

env:
  GODOT_VERSION: 4.7.2

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Godot and the Linux export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/linux_release.x86_64 templates/version.txt -d "$RUNNER_TEMP"
          echo "GODOT_TEMPLATES=$RUNNER_TEMP/templates" >> "$GITHUB_ENV"

      - name: Package Linux
        run: packaging/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: dist/builds/*

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: brew install scons nasm

      - name: Install Godot and the macOS export template
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q godot.zip -d "$RUNNER_TEMP"
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q templates.tpz templates/macos.zip templates/version.txt -d "$RUNNER_TEMP"
          echo "GODOT_TEMPLATES=$RUNNER_TEMP/templates" >> "$GITHUB_ENV"

      # The static dependencies take a while to build and change only with the script.
      - uses: actions/cache@v4
        with:
          path: dist/macos/deps-*
          key: macos-deps-${{ hashFiles('packaging/macos/build-deps.sh') }}

      - name: Package macOS
        run: packaging/macos/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: dist/builds/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: dist/builds
          merge-multiple: true

      - name: Checksums
        working-directory: dist/builds
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" dist/builds/* --title "Linguini $TAG" --generate-notes --verify-tag $prerelease

  pages:
    needs: release
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      tag: ${{ github.ref_name }}
